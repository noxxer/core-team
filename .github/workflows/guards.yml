name: guards

# Гард, падение которого никто не потребляет, не является гардом.
# Этот прогон — потребитель гардов самого фреймворка.

on:
  push:
  pull_request:

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: jq присутствует
        run: jq --version

      # Кросс-платформенность shellcheck НЕ проверяет: он разбирает синтаксис
      # оболочки, а не аргументы чужих программ. Проба: файл с четырьмя
      # несовместимостями подряд (`date -j`, `stat -f`, `grep -P`, `readlink -f`)
      # даёт ноль замечаний shellcheck на любом уровне строгости.
      # Раньше здесь стояли три отдельных шага — три копии одного предмета.
      - name: переносимость инструмента (BSD ↔ GNU)
        run: bash .claude/hooks/check-portability.sh

      - name: shellcheck
        run: shellcheck --severity=warning .claude/hooks/*.sh

      # Тест доказывает, что сверка работает; этот шаг проверяет сам репозиторий.
      # Замер: plugin.json объявлял 4.5.0 при VERSION 5.0.0 — два релиза расхождения.
      - name: версия согласована во всех объявлениях
        run: bash .claude/hooks/check-version-sync.sh

      # Витрина и манифесты плагинов — две записи об одном предмете. Расходятся
      # молча: установка идёт у потребителя, и он о расхождении не сообщает.
      # Замер: витрина не проходила схему CLI с самого заведения.
      - name: витрина маркетплейса согласована с репозиторием
        run: bash .claude/hooks/check-marketplace.sh

      # Переименование ломает ссылки молча: файл переехал, тексты называют старый путь.
      # Первый прогон нашёл 10 битых ссылок, три — свежие, от выноса ремесла в плагин.
      - name: ссылки ведут в существующие файлы
        run: bash .claude/hooks/check-links.sh

      # Скрипты плагинов — такой же инструмент, как хуки ядра, и ломаются так же.
      # Замер: плоский обход прибора переносимости печатал «нет ни одного файла .sh»
      # при двух существующих внутри plugins/.
      - name: переносимость скриптов плагинов
        shell: bash
        run: |
          if [ -d plugins ]; then
            bash .claude/hooks/check-portability.sh plugins
          else
            echo "плагинов в репозитории нет — проверять нечего"
          fi

      # Потребитель устанавливает фреймворк как `cp -r core-team/.claude .`, то есть
      # получает ровно то, что лежит в git. Файл под .gitignore до него не доедет,
      # и узнать об этом можно только у потребителя. Единственное законное
      # исключение — личные настройки машины.
      - name: ни один файл фреймворка не выпал из пакета
        shell: bash
        run: |
          ignored=$(git ls-files --others --ignored --exclude-standard -- .claude/ \
                    | grep -v '^\.claude/settings\.local\.json$' || true)
          if [ -n "$ignored" ]; then
            echo "под .gitignore и потому не доедут до потребителя:" >&2
            echo "$ignored" >&2
            exit 1
          fi
          tracked=$(git ls-files .claude/ | wc -l)
          if [ "$tracked" -eq 0 ]; then
            echo "в пакете ноль файлов .claude/ — перечисляющая проверка на пустом множестве не считается успехом" >&2
            exit 1
          fi
          echo "в пакете $tracked файлов, выпавших нет"

      # «Файл лежит» ≠ «подключено». Проверяем копию, а не только скрипты.
      - name: целостность развёрнутой копии
        run: bash .claude/hooks/check-install-integrity.sh

      - name: Прогон гардов фреймворка
        shell: bash
        run: |
          shopt -s nullglob
          # Наборы плагинов прогоняются вместе с наборами ядра: гард, который
          # никто не запускает, гардом не является — где бы он ни лежал.
          tests=(.claude/hooks/*.test.sh plugins/*/scripts/*.test.sh)

          # Половина «найдено не ноль»: пустой перечень тестов зелёным не считается.
          # Перечисляющая проверка на пустом множестве проходит по построению.
          if [ ${#tests[@]} -eq 0 ]; then
            echo "гардов не найдено — прогон пуст, это не успех" >&2
            exit 1
          fi

          status=0
          for test in "${tests[@]}"; do
            echo "== $test"
            bash "$test" || status=1
          done
          exit $status
