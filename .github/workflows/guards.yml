name: guards

# Гард, падение которого никто не потребляет, не является гардом.
# Этот прогон — потребитель гардов самого фреймворка.

on:
  push:
  pull_request:

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: jq присутствует
        run: jq --version

      # Класс shell-дефектов, который не поймает ни один тест поведения.
      # severity=warning: предупреждения и ошибки блокируют, стилевые замечания — нет.
      # Класс, пойманный дважды за одну сессию: `«$var»` — bash забирает первый
      # байт многобайтового символа в имя переменной, `set -u` роняет скрипт.
      # shellcheck ловит это как SC2154, но проверка дешевле и говорит по делу.
      - name: переменная не упирается в не-ASCII
        run: |
          if grep -nP '\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7F]' .claude/hooks/*.sh; then
            echo "^ подставь фигурные скобки: \${var}, иначе байт символа уйдёт в имя" >&2
            exit 1
          fi

      - name: shellcheck
        run: shellcheck --severity=warning .claude/hooks/*.sh

      # Тест доказывает, что сверка работает; этот шаг проверяет сам репозиторий.
      # Замер: plugin.json объявлял 4.5.0 при VERSION 5.0.0 — два релиза расхождения.
      - name: версия согласована во всех объявлениях
        run: bash .claude/hooks/check-version-sync.sh

      # Потребитель устанавливает фреймворк как `cp -r core-team/.claude .`, то есть
      # получает ровно то, что лежит в git. Файл под .gitignore до него не доедет,
      # и узнать об этом можно только у потребителя. Единственное законное
      # исключение — личные настройки машины.
      - name: ни один файл фреймворка не выпал из пакета
        shell: bash
        run: |
          ignored=$(git ls-files --others --ignored --exclude-standard -- .claude/ \
                    | grep -v '^\.claude/settings\.local\.json$' || true)
          if [ -n "$ignored" ]; then
            echo "под .gitignore и потому не доедут до потребителя:" >&2
            echo "$ignored" >&2
            exit 1
          fi
          tracked=$(git ls-files .claude/ | wc -l)
          if [ "$tracked" -eq 0 ]; then
            echo "в пакете ноль файлов .claude/ — перечисляющая проверка на пустом множестве не считается успехом" >&2
            exit 1
          fi
          echo "в пакете $tracked файлов, выпавших нет"

      # «Файл лежит» ≠ «подключено». Проверяем копию, а не только скрипты.
      - name: целостность развёрнутой копии
        run: bash .claude/hooks/check-install-integrity.sh

      - name: Прогон гардов фреймворка
        shell: bash
        run: |
          shopt -s nullglob
          tests=(.claude/hooks/*.test.sh)

          # Половина «найдено не ноль»: пустой перечень тестов зелёным не считается.
          # Перечисляющая проверка на пустом множестве проходит по построению.
          if [ ${#tests[@]} -eq 0 ]; then
            echo "гардов не найдено — прогон пуст, это не успех" >&2
            exit 1
          fi

          status=0
          for test in "${tests[@]}"; do
            echo "== $test"
            bash "$test" || status=1
          done
          exit $status
